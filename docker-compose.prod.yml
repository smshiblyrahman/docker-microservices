services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: appdb
    secrets:
      - db_user
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    image: ${ACR_NAME:-myregistry.azurecr.io}/app/auth:${IMAGE_TAG:-1.0.0}
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/appdb
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - jwt_secret
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64k
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    image: ${ACR_NAME:-myregistry.azurecr.io}/app/backend:${IMAGE_TAG:-1.0.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/appdb
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth:5001
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64k
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.20'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    image: ${ACR_NAME:-myregistry.azurecr.io}/app/worker:${IMAGE_TAG:-1.0.0}
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/appdb
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64k
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.20'
          memory: 128M

  frontend:
    image: ${ACR_NAME:-myregistry.azurecr.io}/app/frontend:${IMAGE_TAG:-1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
      - /var/cache/nginx:rw,noexec,nosuid,size=10M
      - /var/run:rw,noexec,nosuid,size=1M
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
